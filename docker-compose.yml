services:
  brain-bot:
    build: .
    command: python brain_bot.py
    restart: unless-stopped
    volumes:
      - ./config.py:/app/config.py:ro
      - brain-data:/brain
    environment:
      - PYTHONUNBUFFERED=1

  mind-bot:
    build: .
    command: python mind_bot.py
    restart: unless-stopped
    volumes:
      - ./config.py:/app/config.py:ro
      - brain-data:/brain
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  brain-data:
    driver: local
